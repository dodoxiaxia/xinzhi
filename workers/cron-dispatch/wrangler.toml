# Repository copy of the live xinzhi-cron timer. Actions does not deploy this worker.
# Live schedule: minute 7, every 2 hours, dispatching daily.yml (see index.js).
name = "xinzhi-cron"
main = "index.js"
compatibility_date = "2024-09-23"
workers_dev = true
keep_vars = true

[triggers]
crons = ["7 */2 * * *"]

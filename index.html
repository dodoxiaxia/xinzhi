<!doctype html>
<html lang="zh-CN" data-theme="light" data-style="a">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>心知 AIHOT-Med · 心血管与AI医疗前沿文献情报台</title>
  <meta name="description" content="面向科室同事的心血管与 AI 医疗每日精选、近7天榜与文献雷达。所有导读均标注核对范围，仅供学习讨论。">
  <meta name="theme-color" content="#ffffff">
  <script>
    // Resolve light/dark before CSS and body paint; storage may be unavailable.
    // One interface style remains ("a", 临床期刊); an old saved choice or ?style= is ignored.
    (function () {
      const root = document.documentElement, params = new URLSearchParams(location.search);
      const read = key => { try { return localStorage.getItem(key); } catch (e) { return null; } };
      try { localStorage.removeItem('xz-style'); } catch (e) {}
      const choose = (values, query, saved, fallback) => values.includes(query) ? query : values.includes(saved) ? saved : fallback;
      let systemTheme = 'light';
      try { if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) systemTheme = 'dark'; } catch (e) {}
      const theme = choose(['light', 'dark'], params.get('theme'), read('xinzhi_theme'), systemTheme);
      const backgrounds = { light: '#eef2f7', dark: '#0e1520' }, bars = { light: '#ffffff', dark: '#141d2b' };
      function apply(theme) {
        if (!['light', 'dark'].includes(theme)) return;
        if (root.dataset.theme !== theme) root.dataset.theme = theme;
        root.dataset.style = 'a';
        root.style.colorScheme = theme;
        root.style.backgroundColor = backgrounds[theme];
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = bars[theme];
      }
      window.XINZHI_BOOT = { theme, style: 'a', apply };
      apply(theme);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="alternate" type="application/rss+xml" title="心知 · 每日精选" href="feed.xml">
  <link rel="icon" href="icon.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon.png">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-container">
      <nav class="header-nav" aria-label="核心视角导航">
        <button class="nav-tab-btn active" data-mode="curated">每日精选 <span class="badge" id="curatedCountBadge">0</span></button>
        <button class="nav-tab-btn" data-mode="weekly">近7天榜</button>
        <button class="nav-tab-btn" data-mode="candidates">文献雷达 <span class="badge" id="candCountBadge">0</span></button>
        <button class="nav-tab-btn" data-mode="library">文献库 <span class="badge" id="libCountBadge">0</span></button>
      </nav>

    </div>
  </header>

  <!-- Tool bar: search (opens above the filters), filters, 筛选 -->
  <div class="tool-bar" id="toolBar">
    <div class="search-panel" id="searchPanel" hidden>
      <div class="search-wrapper">
        <input type="search" id="globalSearch" class="search-input" placeholder="搜索题名、DOI…" aria-label="搜索文献（支持中文关键词）" autocomplete="off">
        <button type="button" class="search-clear" data-clear="search" aria-label="清除搜索">&times;</button>
      </div>
    </div>
    <div class="tool-row" id="toolRow">
      <button type="button" class="tool-btn search-toggle" id="searchToggleBtn" aria-label="搜索" aria-expanded="false" aria-controls="searchPanel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <div id="streamLaneSlot"><div class="lane-bar" id="laneBar" role="group" aria-label="内容分类"></div></div>
      <div class="lane-bar range-bar" id="ftBar" role="group" aria-label="全文状态" hidden></div>
      <button class="btn-sm filter-toggle-btn" id="filterToggleBtn" aria-expanded="false" aria-controls="appSidebar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="filter-label">筛选</span></button>
    </div>
  </div>

  <!-- App Main Layout -->
  <div class="app-container">

    <!-- Left Faceted Filter Sidebar -->
    <aside class="sidebar" id="appSidebar" role="dialog" aria-label="筛选" aria-modal="true">
      <div class="sheet-head"><button class="panel-reset" id="panelResetBtn" type="button">重置</button><b>筛选</b><button class="sheet-close" id="sheetClose" type="button" aria-label="关闭筛选">&times;</button></div>
      <div class="panel-body" id="panelBody">
        <section class="panel-group" id="pgLane"><h3>领域</h3><div class="panel-options" id="panelOptLane" role="group" aria-label="领域"></div></section>
        <section class="panel-group" id="pgFt"><h3>全文状态</h3><div class="panel-options" id="panelOptFt" role="group" aria-label="全文状态"></div><h4 class="panel-sub">可读内容</h4><div class="panel-options" id="panelOptReading" role="group" aria-label="可读内容"></div></section>
        <section class="panel-group" id="pgRange"><h3>发表时间</h3><div class="panel-options" id="panelOptRange" role="group" aria-label="发表时间"></div></section>
        <section class="panel-group" id="pgJournal"><h3>期刊</h3>
          <h4 class="panel-sub">我的期刊</h4>
          <div class="panel-options" id="panelOptJournal" role="group" aria-label="我的期刊"></div>
          <button type="button" class="panel-opt panel-follow" id="favoriteJournalBtn" aria-pressed="false">☆ 关注期刊</button>
          <h4 class="panel-sub">信源分组</h4>
          <div class="panel-options" id="tierFilterList" role="group" aria-label="信源分组"></div>
          <h4 class="panel-sub">出版方</h4>
          <div class="panel-options publisher-chips" id="publisherAccordion" role="group" aria-label="出版方与期刊"></div>
        </section>
        <section class="panel-group" id="pgType"><h3>文章类型</h3><div class="panel-options" id="panelOptType" role="group" aria-label="文章类型"></div></section>
        <details class="panel-more">
          <summary>更多条件</summary>
          <h4 class="panel-sub">研究设计</h4>
          <div class="panel-options" id="designFilterList" role="group" aria-label="研究设计"></div>
          <h4 class="panel-sub">主题标签</h4>
          <div class="panel-options" id="tagsCloud" role="group" aria-label="主题标签"></div>
        </details>
      </div>
      <div class="panel-foot"><button type="button" class="btn-sm btn-primary" id="panelApplyBtn">查看 0 篇</button></div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Stream Section (for Candidates, Curated, Library) -->
      <section id="streamSection">
        <div class="stream-reading-layout">
        <div class="stream-content">
        <!-- Stream Toolbar -->
        <div class="stream-toolbar">
          <div class="active-filters-bar" id="activeFiltersBar" tabindex="-1" aria-label="当前筛选与结果数量"></div>
        </div>

        <div class="list-head" id="listHead">
          <span class="heading-total" id="listTotal" role="status">共 0 篇</span>
          <span class="stream-controls" id="listHeadTools">
            <div class="ai-digest" id="aiDigest" hidden></div>
            <label for="sortSelector" class="sr-only">排序方式</label>
            <select id="sortSelector" class="sort-select">
              <option value="date-desc">最新在前</option>
              <option value="date-asc">最早在前</option>
              <option value="journal-date">按期刊分组</option>
              <option value="smart">导读与摘要优先</option>
            </select>
            <span class="view-toggle">
              <button class="view-toggle-btn active" id="viewCardsBtn" title="卡片视图">详细</button>
              <button class="view-toggle-btn" id="viewCompactBtn" title="紧凑列表">列表</button>
            </span>
          </span>
        </div>
        <div class="mode-note" id="modeNote" hidden></div>

        <!-- Articles Stream -->
        <div id="articlesStream" class="articles-stream">
          <!-- Dynamic cards or compact rows -->
        </div>

        <!-- Load More Button -->
        <button id="loadMoreBtn" class="load-more-btn" hidden>显示更多</button>
        </div>
        <aside class="stream-rail" id="streamRail" aria-label="阅读导航与主题" hidden>
          <div class="lane-bar day-bar" id="curatedDayBar" role="group" aria-label="精选日期" hidden></div>
          <div id="curatedTopicsSlot"></div>
        </aside>
        </div>
      </section>

      <!-- Weekly Deep Read Section (Journal Club) -->
      <section id="weeklySection" class="weekly-container" data-pane="board" hidden>
        <div class="weekly-pane-switch" id="weeklyPaneSwitch" role="tablist" aria-label="近7天榜内容">
          <button type="button" role="tab" id="weeklyPaneBoardTab" data-weekly-pane="board" aria-controls="weeklyBoardPane" aria-selected="true">榜单 <span id="weeklyPaneBoardCount"></span></button>
          <button type="button" role="tab" id="weeklyPaneReadingTab" data-weekly-pane="reading" aria-controls="weeklyReadingPane" aria-selected="false">全文精读 <span id="weeklyPaneReadingCount"></span></button>
        </div>
        <div class="weekly-board-pane" id="weeklyBoardPane" role="tabpanel" aria-labelledby="weeklyPaneBoardTab">
          <div class="next-candidates" id="weeklyAuto"></div>
          <details class="weekly-next" id="weeklyNextWrap" hidden><summary>下期候选 <small>来自文献库，尚未评估质量</small></summary><div class="next-candidates" id="nextCandidates"></div></details>
        </div>
        <aside class="weekly-deep-read" id="weeklyReadingPane" role="tabpanel" aria-labelledby="weeklyPaneReadingTab" aria-label="全文精读">
          <h3 class="next-title">全文精读</h3>
          <div id="dailyDeepRead" aria-label="每日全文精读" aria-live="polite"><p class="deep-reading-empty">正在读取精读内容…</p></div>
          <h4 class="deep-reading-demo-label">体例示范</h4>
          <button type="button" class="deep-reading-item deep-reading-demo-item" data-action="open-deep-reading" data-reading-id="demo-tailored-af"><span class="deep-reading-item-title">AI 指导的持续性房颤消融：获益与临床边界</span><small>TAILORED-AF · Nature Medicine · 2025 年论文，非本周新文</small><span class="deep-reading-go">读精读 →</span></button>
        </aside>
      </section>

      <!-- Sources Observability Section -->
      <section id="sourcesSection" hidden>
        <div class="sources-heading"><h2>信源状态</h2><p>最近一次订阅检查。有效空源也计为获取成功；异常时保留旧缓存。抓取状态不代表文献质量。</p></div>
        <div class="sources-summary" id="sourcesHealthSummary" aria-label="信源检查概况"></div>
        <p id="sourcesHealthMeta" class="source-report-age" role="note"></p>
        <div class="sources-grid" id="sourcesHealthGrid">
          <!-- Dynamically populated -->
        </div>
      </section>

    </main>
  </div>

  <footer class="app-footer" id="appFooter">
    <button class="huddle-btn" id="openHuddleBtn" aria-label="打开精选清单（仅此浏览器）" title="精选清单（仅此浏览器）">
      <span class="huddle-label">精选清单</span><span class="huddle-icon" aria-hidden="true">☆</span>
      <span class="huddle-counter" id="huddleCounter">0</span>
    </button>
    <button class="icon-btn" id="themeToggle" title="切换深色/浅色" aria-label="切换深色/浅色">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
    <button class="source-status-btn" id="sourceStatusBtn" type="button" data-mode="sources" aria-controls="sourcesSection" aria-pressed="false">信源状态</button>
  </footer>

  <!-- Slide-over Reader Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="reader-drawer" id="readerDrawer" aria-modal="true" aria-hidden="true" tabindex="-1" role="dialog" aria-label="文献阅读台">
    <div class="drawer-header">
      <div id="drawerJournalBadges"></div>
      <button class="drawer-close-btn" id="drawerCloseBtn" title="关闭 (Esc)" aria-label="关闭">&times;</button>
    </div>

    <div class="drawer-body" id="drawerBody">
      <!-- Populated dynamically -->
    </div>

    <div class="drawer-footer">
      <a href="#" target="_blank" rel="noopener" class="btn-sm btn-primary" id="drawerPdfLink" data-ft-download hidden>下载 PDF</a>
      <form class="ft-form ft-dl-form" id="drawerPdfForm" data-ft-dl-form hidden><label>全文口令 <input name="passphrase" type="password" maxlength="256" autocomplete="current-password" required></label><button type="submit" class="btn-sm btn-primary">下载</button><span class="ft-error" role="alert"></span></form>
      <button class="btn-sm btn-share" id="drawerCopyShareBtn">微信群文案</button>
      <button class="btn-sm" id="drawerHuddleToggleBtn">加入精选清单</button>
      <a href="#" target="_blank" rel="noopener" class="btn-sm" id="drawerExternalLink">官网原文 ↗</a>
      <a href="https://login.emedien3.sub.uni-hamburg.de/han/ScienceDirectElsevierJournalBackfiles" target="_blank" rel="noopener noreferrer" class="btn-sm" id="drawerInstitutionLoginLink" title="如需登录先打开此入口；登录页未出现时可再点击一次，在新标签打开" hidden>汉堡登录入口 ↗</a>
      <a href="#" target="_blank" rel="noopener noreferrer" class="btn-sm" id="drawerInstitutionLink" title="需在打开的浏览器中正常登录汉堡机构入口" hidden>通过汉堡访问 ↗</a>
    </div>
  </aside>

  <!-- Full-text reading panel -->
  <aside class="reader-drawer deep-reader" id="deepReader" aria-modal="true" aria-hidden="true" tabindex="-1" role="dialog" aria-labelledby="deepReaderTitle">
    <div class="deep-reader-head">
      <div class="deep-reader-heading">
        <span class="content-label" id="deepReaderLabel"></span>
        <h2 id="deepReaderTitle"></h2>
        <p class="deep-reader-meta" id="deepReaderMeta"></p>
      </div>
      <button class="drawer-close-btn" id="deepReaderClose" type="button" title="关闭 (Esc)" aria-label="关闭精读">&times;</button>
    </div>
    <nav class="deep-reader-toc" id="deepReaderToc" aria-label="本篇目录"></nav>
    <div class="drawer-body deep-reader-body" id="deepReaderBody"></div>
    <div class="drawer-footer deep-reader-foot">
      <button class="btn-sm" type="button" id="deepReaderPrev">← 上一篇</button>
      <button class="btn-sm" type="button" id="deepReaderNext">下一篇 →</button>
      <span class="deep-reader-pos" id="deepReaderPos"></span>
      <span class="deep-reader-links" id="deepReaderLinks"></span>
    </div>
  </aside>

  <!-- Morning Huddle Modal -->
  <div class="modal-backdrop" id="huddleModalBackdrop">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-label="精选清单">
      <div class="modal-header">
        <h3 style="font-size: 16px; font-weight: 600;">精选文献清单</h3>
        <small class="selection-storage-note">仅此浏览器保存</small>
        <button class="drawer-close-btn" id="closeHuddleModalBtn" aria-label="关闭">&times;</button>
      </div>

      <div class="modal-body" id="huddleModalBody">
        <!-- List of selected articles -->
      </div>

      <div class="modal-footer">
        <button class="btn-sm" id="clearHuddleBtn">清空清单</button>
        <div style="display: flex; gap: 8px;">
          <button class="btn-sm btn-share" id="copyHuddleSummaryBtn">复制精选汇总</button>
          <button class="btn-sm btn-primary" id="exportHuddleMdBtn">导出 Markdown</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Global Toast -->
  <div id="toast" role="status">已更新</div>
  <button type="button" id="backToTopBtn" class="back-to-top" aria-label="回到页面顶部" title="回到页面顶部" hidden><span aria-hidden="true">↑</span></button>

  <!-- App Data & Scripts -->
  <script src="data/library.js"></script>
  <script src="data/candidates.js"></script>
  <script src="data/source-health.js"></script>
  <script src="data/curated.js"></script>
  <script src="data/quicklooks.js"></script>
  <script src="citation-export.js"></script>
  <script src="app.js"></script>
</body>
</html>

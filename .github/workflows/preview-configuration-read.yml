name: preview-configuration-read
on:
  push:
    branches: [codex/preview403-configuration-read-20261008]
permissions:
  contents: read
jobs:
  read-existing-configuration:
    if: github.ref == 'refs/heads/codex/preview403-configuration-read-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read existing deployment, Access and Analytics permissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/read_preview_configuration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview403-configuration-${{ github.run_id }}
          path: .local/preview403-configuration/report.json
          if-no-files-found: error

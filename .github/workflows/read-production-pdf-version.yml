name: read-production-pdf-version
on:
  push:
    branches: [codex/pdf-version-read-20261008]
permissions:
  contents: read
jobs:
  read:
    if: github.ref == 'refs/heads/codex/pdf-version-read-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read only the authorized non-secret PDF commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/read_production_pdf_version.py
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-version-read-${{ github.run_id }}
          path: .local/pdf-version-read/report.json
          if-no-files-found: error


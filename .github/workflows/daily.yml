name: daily-refresh

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'icon.svg'
      - 'journal-metrics.js'
      - 'edge/**'
      - 'scripts/**'
      - 'editorial/**'
      - 'config/public_library_adjudications.json'
      - 'config/journal-metrics.json'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '17 21 * * *'   # 每天北京时间 05:17:完整刷新(归档、补摘要、翻译)
    - cron: '7 */2 * * *'   # 每 2 小时:轻量刷新,内容有变化才发布
  workflow_dispatch:
    inputs:
      mode:
        description: 'full=完整刷新(默认) / fast=人工临时轻量刷新'
        default: 'full'
        type: choice
        options: [full, fast]
      allow_fast_dispatch:
        description: '确认人工临时快刷；旧外部定时器的重复 fast 请求默认忽略'
        default: false
        type: boolean

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ignored-dispatch:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'fast' && !inputs.allow_fast_dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "::notice::已忽略未确认的 fast dispatch；定时快刷由 GitHub 每两小时运行，人工临时快刷请勾选 allow_fast_dispatch。此门禁不代表外部定时器已停用。"
  refresh:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'fast' || inputs.allow_fast_dispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      XINZHI_LLM_ENDPOINT: ${{ vars.XINZHI_LLM_ENDPOINT }}
      XINZHI_LLM_MODEL: ${{ vars.XINZHI_LLM_MODEL }}
      XINZHI_LLM_API_KEY: ${{ secrets.XINZHI_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: 恢复数据(state 分支:data/ public/ 等私有数据,不含历史)
        id: restore_state
        run: |
          rm -f docs/last-refresh.json docs/deployment-status.json .local/week-checkpoint-head
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch --depth=1 origin state
            RESTORED_STATE_SHA=$(git rev-parse FETCH_HEAD)
            echo "sha=$RESTORED_STATE_SHA" >> "$GITHUB_OUTPUT"
            # State carries runtime data only; never let it overwrite main code.
            git archive "$RESTORED_STATE_SHA" data public | tar -x -C .
            for STATE_DOC in public-manifest.json last-refresh.json deployment-status.json; do
              if git cat-file -e "$RESTORED_STATE_SHA:docs/$STATE_DOC" 2>/dev/null; then
                git archive "$RESTORED_STATE_SHA" "docs/$STATE_DOC" | tar -x -C .
              fi
            done
          else
            echo "::error::没有 state 分支,请先运行 scripts/seed_state.sh 播种一次"; exit 1
          fi
          # A restored report describes an older run, never this attempt.
          rm -f docs/last-refresh.json docs/deployment-status.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 / 补摘要 / 翻译 / 构建
        id: refresh
        env:
          # Opt-in only after integrator review; reuses the existing token/permissions.
          XINZHI_PRECOMPUTE_STATE_CHECKPOINT: ${{ vars.XINZHI_PRECOMPUTE_STATE_CHECKPOINT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_daily.py ${{ (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule != '17 21 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'fast')) && '--fast' || '' }}

      - uses: actions/setup-node@v4
        if: steps.refresh.outputs.deploy == 'true'
        with:
          node-version: '20'

      - name: 发布前验证公开摘要服务（离线，不调用模型）
        if: steps.refresh.outputs.deploy == 'true'
        run: |
          node --check app.js
          node scripts/test_reading_logic.cjs
          node scripts/test_edge_worker.cjs
          node scripts/test_pdf_worker.cjs
          node scripts/test_doi_library_worker.cjs
          node scripts/test_doi_library_ui.cjs --helpers-only
          node scripts/test_study_services.cjs
          node scripts/test_study_evidence_regression.cjs
          node scripts/test_study_ui.cjs
          node scripts/test_source_health_ui.cjs
          node scripts/test_weekly_window.cjs
          node scripts/test_publication_dates_ui.cjs
          node scripts/test_journal_metrics.cjs
          python3 -m unittest discover -s scripts -p 'test_week_precompute*.py'
          python3 -m unittest discover -s scripts -p 'test_journal*.py'
          python3 -m unittest discover -s scripts -p 'test_ci_daily.py'
          python3 -m unittest discover -s scripts -p 'test_workflow.py'
          python3 -m unittest discover -s scripts -p 'test_public_build.py'
          python3 -m unittest discover -s scripts -p 'test_package_release.py'
          python3 -m unittest discover -s scripts -p 'test_release_build.py'
          python3 -m unittest discover -s scripts -p 'test_editorial_review.py'
          python3 -m unittest discover -s scripts -p 'test_feed_health.py'
          python3 -m unittest discover -s scripts -p 'test_source_fallbacks.py'
          python3 -m unittest discover -s scripts -p 'test_pubmed_request.py'
          python3 -m unittest discover -s scripts -p 'test_sync_public_library.py'
          python3 -m unittest discover -s scripts -p 'test_apply_public_library.py'
          python3 -m unittest discover -s scripts -p 'test_publication_dates.py'
          PYTHONPATH=scripts python3 -c 'from package_release import public_payloads; public_payloads()'

      - name: 发布到 Cloudflare Pages
        id: deploy
        if: steps.refresh.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy public --project-name dryz-xinzhi --branch main --commit-dirty=true

      - name: 记录部署结果(刷新成功不等于发布成功)
        if: always()
        run: >-
          python3 scripts/finalize_pipeline.py
          --refresh-outcome '${{ steps.refresh.outcome }}'
          --deployment-outcome '${{ steps.deploy.outcome }}'
          --state-outcome 'pending'
          --deployment-requested '${{ steps.refresh.outputs.deploy }}'
          --run-url 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          --code-sha '${{ github.sha }}'
          --run-attempt '${{ github.run_attempt }}'

      - name: 发布成功后保存 state(覆盖式,不累积历史)
        id: save_state
        if: steps.refresh.outcome == 'success' && steps.deploy.outcome == 'success'
        run: |
          set -e
          STATE_EXPECTED_SHA='${{ steps.restore_state.outputs.sha }}'
          if test -f .local/week-checkpoint-head; then
            STATE_EXPECTED_SHA=$(cat .local/week-checkpoint-head)
            [[ "$STATE_EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          fi
          T=$(mktemp -d)
          mkdir -p "$T/s/docs"
          cp -r data public "$T/s/"
          cp docs/public-manifest.json docs/last-refresh.json docs/deployment-status.json "$T/s/docs/"
          cd "$T/s"
          git init -q -b state
          git config user.name "xinzhi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -qm "state $(date -u +%F)"
          git push --force-with-lease=refs/heads/state:"$STATE_EXPECTED_SHA" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" state

      - name: 记录流水线最终结果
        if: always()
        run: >-
          python3 scripts/finalize_pipeline.py
          --refresh-outcome '${{ steps.refresh.outcome }}'
          --deployment-outcome '${{ steps.deploy.outcome }}'
          --state-outcome '${{ steps.save_state.outcome }}'
          --deployment-requested '${{ steps.refresh.outputs.deploy }}'
          --run-url 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          --code-sha '${{ github.sha }}'
          --run-attempt '${{ github.run_attempt }}'

      - name: 上传成功或失败的流水线证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/deployment-status.json
            docs/last-refresh.json
            docs/public-manifest.json
            data/week-precompute-ledger.json
            data/week-precompute-cache.json
          if-no-files-found: error

name: daily-refresh

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'src/**'
      - 'citation-export.js'
      - 'style.css'
      - 'icon.png'
      - 'demo-reading.html'
      - 'journal-metrics.js'
      - 'edge/**'
      - 'workers/cron-dispatch/**'
      - 'scripts/**'
      - 'editorial/**'
      - 'config/public_library_adjudications.json'
      - 'config/journal-metrics.json'
      - 'config/publication-status.json'
      - '.github/workflows/daily.yml'
      - '.github/workflows/fulltext.yml'
      - '.github/workflows/fulltext-import.yml'
      - '.github/workflows/muse-review.yml'
  schedule:
    # 避开整点前后的 GitHub 高负载时段（官方说明此时定时任务常被延迟或丢弃）。
    - cron: '47 20 * * *'   # 每天北京时间 04:47:完整刷新(归档、补摘要、翻译)
    - cron: '37 */4 * * *'  # 每 4 小时:轻量刷新兜底(外部每 2 小时触发,gate 限为约 4 小时一次)
  workflow_dispatch:
    inputs:
      mode:
        description: 'full=完整刷新(默认) / fast=人工临时轻量刷新'
        default: 'full'
        type: choice
        options: [full, fast]
      allow_fast_dispatch:
        description: '兼容旧参数；不再起作用'
        default: false
        type: boolean
      force:
        description: 'fast 时跳过约 3 小时最短间隔(人工临时刷新用)'
        default: false
        type: boolean

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    # Owner choice (2026-10-11): timed fast refreshes every 3-4 hours. The external dispatcher
    # (:07, every 2 hours) is the only punctual timer observed, so it stays; this small job skips
    # a timed fast run when the last successful refresh started under 170 minutes ago, unless
    # today's full refresh is still missing. Pushes, full runs and forced runs always pass.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: 轻量刷新最短间隔
        id: gate
        env:
          TIMED_FAST: ${{ ((github.event_name == 'schedule' && github.event.schedule != '47 20 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'fast' && !inputs.force)) && '1' || '' }}
          XINZHI_FAST_MIN_INTERVAL_MINUTES: ${{ vars.XINZHI_FAST_MIN_INTERVAL_MINUTES || '170' }}
          STATE_URL: https://x-access-token:${{ secrets.XINZHI_STATE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ vars.XINZHI_STATE_REPO || github.repository }}.git
        run: |
          if [ "$TIMED_FAST" != 1 ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p .gate
          if git fetch -q --depth=1 "$STATE_URL" state; then
            git show FETCH_HEAD:docs/last-refresh.json > .gate/last.json 2>/dev/null || true
            git show FETCH_HEAD:data/full-refresh-marker.json > .gate/marker.json 2>/dev/null || true
            git show FETCH_HEAD:data/timed-refresh-marker.json > .gate/timed.json 2>/dev/null || true
          fi
          python3 scripts/fast_refresh_gate.py .gate/last.json .gate/marker.json .gate/timed.json | tee -a "$GITHUB_OUTPUT" \
            || echo run=true >> "$GITHUB_OUTPUT"

  refresh:
    # The concurrency group serialises overlapping runs, and an unchanged fast run does not deploy.
    needs: gate
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Covers ci_daily's 110-minute full budget plus tests, deploy and state save.
    timeout-minutes: 150
    env:
      XINZHI_LLM_ENDPOINT: ${{ vars.XINZHI_LLM_ENDPOINT }}
      XINZHI_LLM_MODEL: ${{ vars.XINZHI_LLM_MODEL }}
      XINZHI_LLM_API_KEY: ${{ secrets.XINZHI_LLM_API_KEY }}
      # Optional ceilings (unset = defaults in code): weekly calls per UTC day, full-text readings per day.
      XINZHI_WEEK_MAX_CALLS: ${{ vars.XINZHI_WEEK_MAX_CALLS }}
      XINZHI_DEEP_READING_TARGET: ${{ vars.XINZHI_DEEP_READING_TARGET }}
      # Runtime data (data/, public/, run reports) lives on the `state` branch of
      # vars.XINZHI_STATE_REPO (a private repository; token in secrets.XINZHI_STATE_TOKEN with
      # Contents read/write). Without them it stays on this repository's own state branch.
      XINZHI_STATE_REPOSITORY: ${{ vars.XINZHI_STATE_REPO || github.repository }}
      XINZHI_STATE_TOKEN: ${{ secrets.XINZHI_STATE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 恢复数据(state 分支:data/ public/ 等私有数据,不含历史)
        id: restore_state
        run: |
          rm -f docs/last-refresh.json docs/deployment-status.json .local/week-checkpoint-head
          STATE_URL="${STATE_URL:-https://x-access-token:${XINZHI_STATE_TOKEN}@github.com/${XINZHI_STATE_REPOSITORY}.git}"
          if git ls-remote --exit-code --heads "$STATE_URL" state >/dev/null 2>&1; then
            git fetch -q --depth=1 "$STATE_URL" state
            RESTORED_STATE_SHA=$(git rev-parse FETCH_HEAD)
            echo "sha=$RESTORED_STATE_SHA" >> "$GITHUB_OUTPUT"
            # State carries runtime data only; never let it overwrite main code.
            git archive "$RESTORED_STATE_SHA" data public | tar -x -C .
            for STATE_DOC in public-manifest.json last-refresh.json deployment-status.json; do
              if git cat-file -e "$RESTORED_STATE_SHA:docs/$STATE_DOC" 2>/dev/null; then
                git archive "$RESTORED_STATE_SHA" "docs/$STATE_DOC" | tar -x -C .
              fi
            done
          else
            echo "::error::$XINZHI_STATE_REPOSITORY 没有 state 分支(或令牌无权读取),请先运行 scripts/seed_state.sh 播种一次"; exit 1
          fi
          # A restored report describes an older run, never this attempt.
          rm -f docs/last-refresh.json docs/deployment-status.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 刷新 GitHub 公共签名密钥（不读取凭据）
        continue-on-error: true
        run: python3 scripts/github_oidc_keys.py

      - name: 抓取 / 补摘要 / 翻译 / 构建
        id: refresh
        env:
          # Enabled after integrator review (2026-10-10); set the repo variable to 0 to stop paid weekly precompute.
          XINZHI_PRECOMPUTE_STATE_CHECKPOINT: ${{ vars.XINZHI_PRECOMPUTE_STATE_CHECKPOINT || '1' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XINZHI_RESTORED_STATE_SHA: ${{ steps.restore_state.outputs.sha }}
          # Scheduled and manually dispatched fast runs add title, quicklook, weekly and reading top-ups; pushes stay model-free.
          XINZHI_FAST_TITLE_BATCH: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
          # Timed runs (cron or the external fast dispatch) run the paid full refresh once per Beijing day.
          XINZHI_DAILY_FULL_ONCE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'fast')) && '1' || '' }}
        run: python3 scripts/ci_daily.py ${{ (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule != '47 20 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'fast')) && '--fast' || '' }}

      - uses: actions/setup-node@v4
        if: steps.refresh.outputs.deploy == 'true'
        with:
          node-version: '20'

      - name: 发布前验证公开摘要服务（离线，不调用模型）
        if: steps.refresh.outputs.deploy == 'true'
        run: |
          node --check app.js
          node --check citation-export.js
          node scripts/test_citation_export.cjs
          node scripts/test_reading_logic.cjs
          node scripts/test_edge_worker.cjs
          node scripts/test_pdf_worker.cjs
          node scripts/test_doi_library_worker.cjs
          node scripts/test_doi_direct_download.cjs
          node scripts/test_crossref_pdf_source.cjs
          node scripts/test_grok_fulltext.cjs
          node scripts/test_fulltext_import.cjs
          node scripts/test_muse_fulltext.cjs
          node scripts/test_muse_status_pages.cjs
          node scripts/test_muse_reader_upload.cjs
          npm exec --yes --package=workerd@1.20261009.1 -- node scripts/test_worker_fetch_compat.cjs
          node scripts/test_doi_manual_needed.cjs
          node scripts/test_github_lfs_reuse.cjs
          node scripts/test_lfs_deadline.cjs
          node scripts/test_pdf_diagnostics.cjs
          node scripts/test_doi_source_check.cjs
          node scripts/test_fulltext_jobs.cjs
          node scripts/test_fulltext_activation.cjs
          node scripts/test_fulltext_dispatcher.cjs
          node scripts/test_doi_library_ui.cjs --helpers-only
          node scripts/test_study_services.cjs
          node scripts/test_study_evidence_regression.cjs
          node scripts/test_study_ui.cjs
          node scripts/test_brief_feedback.cjs
          node scripts/test_ai_deadline_lifecycle.cjs
          node scripts/test_ai_waiting_ui.cjs
          node scripts/test_source_health_ui.cjs
          node scripts/test_daily_reading_ui.cjs
          python3 -m unittest discover -s scripts -p 'test_daily_fulltext.py'
          node scripts/test_weekly_window.cjs
          node scripts/test_publication_dates_ui.cjs
          node scripts/test_publication_status_ui.cjs
          node scripts/test_public_content_priority.cjs
          node scripts/test_journal_metrics.cjs
          python3 -m unittest discover -s scripts -p 'test_week_precompute*.py'
          python3 -m unittest discover -s scripts -p 'test_resolve_week_precompute_pause.py'
          python3 -m unittest discover -s scripts -p 'test_sol_public_overlay.py'
          python3 -m unittest discover -s scripts -p 'test_public_editorial_overlay.py'
          python3 -m unittest discover -s scripts -p 'test_home_title_overlay.py'
          python3 -m unittest discover -s scripts -p 'test_tailored_figure_sources.py'
          python3 -m unittest discover -s scripts -p 'test_sol_gap_overlay.py'
          python3 -m unittest discover -s scripts -p 'test_journal*.py'
          python3 -m unittest discover -s scripts -p 'test_ci_daily.py'
          python3 -m unittest discover -s scripts -p 'test_auto_picks.py'
          python3 -m unittest discover -s scripts -p 'test_sciencedirect_dates.py'
          python3 -m unittest discover -s scripts -p 'test_feed.py'
          python3 -m unittest discover -s scripts -p 'test_pubmed_rss_identity.py'
          python3 -m unittest discover -s scripts -p 'test_quicklook_repair.py'
          python3 -m unittest discover -s scripts -p 'test_quicklook_numbers.py'
          python3 -m unittest discover -s scripts -p 'test_fast_refresh_gate.py'
          python3 -m unittest discover -s scripts -p 'test_quicklooks.py'
          python3 -m unittest discover -s scripts -p 'test_week_coverage_status.py'
          python3 -m unittest discover -s scripts -p 'test_public_precompute_pending.py'
          python3 -m unittest discover -s scripts -p 'test_sol_gap_b_overlay.py'
          python3 -m unittest discover -s scripts -p 'test_sol_gap_c_overlay.py'
          python3 -m unittest discover -s scripts -p 'test_workflow.py'
          python3 -m unittest discover -s scripts -p 'test_release_decoupling.py'
          python3 -m unittest discover -s scripts -p 'test_public_build.py'
          python3 -m unittest discover -s scripts -p 'test_public_abstract_sources.py'
          python3 -m unittest discover -s scripts -p 'test_public_library_quality.py'
          python3 -m unittest discover -s scripts -p 'test_public_bibliography_review.py'
          python3 -m unittest discover -s scripts -p 'test_publication_status.py'
          python3 -m unittest discover -s scripts -p 'test_public_content_corrections.py'
          python3 -m unittest discover -s scripts -p 'test_package_release.py'
          python3 -m unittest discover -s scripts -p 'test_release_build.py'
          python3 -m unittest discover -s scripts -p 'test_editorial_review.py'
          python3 -m unittest discover -s scripts -p 'test_feed_health.py'
          python3 -m unittest discover -s scripts -p 'test_source_fallbacks.py'
          python3 -m unittest discover -s scripts -p 'test_pubmed_request.py'
          python3 -m unittest discover -s scripts -p 'test_sync_public_library.py'
          python3 -m unittest discover -s scripts -p 'test_apply_public_library.py'
          python3 -m unittest discover -s scripts -p 'test_publication_dates.py'
          PYTHONPATH=scripts python3 -c 'from package_release import public_payloads; public_payloads()'

      - name: 发布到 Cloudflare Pages
        id: deploy
        if: steps.refresh.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy public --project-name dryz-xinzhi --branch main --commit-dirty=true

      - name: 记录部署结果(刷新成功不等于发布成功)
        if: always()
        run: >-
          python3 scripts/finalize_pipeline.py
          --refresh-outcome '${{ steps.refresh.outcome }}'
          --deployment-outcome '${{ steps.deploy.outcome }}'
          --state-outcome 'pending'
          --deployment-requested '${{ steps.refresh.outputs.deploy }}'
          --run-url 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          --code-sha '${{ github.sha }}'
          --run-attempt '${{ github.run_attempt }}'

      - name: 发布成功后保存 state(覆盖式,不累积历史)
        id: save_state
        if: steps.refresh.outcome == 'success' && steps.deploy.outcome == 'success'
        run: |
          set -e
          STATE_EXPECTED_SHA='${{ steps.restore_state.outputs.sha }}'
          if test -f .local/week-checkpoint-head; then
            STATE_EXPECTED_SHA=$(cat .local/week-checkpoint-head)
            [[ "$STATE_EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          fi
          # A lease mismatch caused only by this run's own checkpoint commits is merged; any other writer still fails.
          STATE_REMOTE="https://x-access-token:${XINZHI_STATE_TOKEN}@github.com/${XINZHI_STATE_REPOSITORY}.git" \
            python3 scripts/save_state.py --expected "$STATE_EXPECTED_SHA"

      - name: 记录流水线最终结果
        if: always()
        run: >-
          python3 scripts/finalize_pipeline.py
          --refresh-outcome '${{ steps.refresh.outcome }}'
          --deployment-outcome '${{ steps.deploy.outcome }}'
          --state-outcome '${{ steps.save_state.outcome }}'
          --deployment-requested '${{ steps.refresh.outputs.deploy }}'
          --run-url 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          --code-sha '${{ github.sha }}'
          --run-attempt '${{ github.run_attempt }}'

      - name: 上传成功或失败的流水线证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/deployment-status.json
            docs/last-refresh.json
            docs/public-manifest.json
            data/week-precompute-ledger.json
            data/week-precompute-cache.json
            data/deep-reading-ledger.json
          if-no-files-found: error

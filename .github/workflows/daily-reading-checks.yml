name: daily-fulltext-reading-checks
on:
  push:
    branches: ['codex/daily-fulltext-reading']
  pull_request:
    paths:
      - 'scripts/daily_fulltext.py'
      - 'scripts/test_daily_fulltext.py'
      - 'scripts/test_daily_reading_ui.cjs'
      - 'scripts/ci_daily.py'
      - 'scripts/build_public.py'
      - 'app.js'
      - 'index.html'
      - 'style.css'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Offline identity, evidence, cache and UI checks
        run: |
          python3 -m py_compile scripts/daily_fulltext.py scripts/build_public.py scripts/ci_daily.py
          node --check app.js
          node scripts/test_daily_reading_ui.cjs
          node scripts/test_reading_logic.cjs
          node scripts/test_weekly_window.cjs
          python3 -m unittest discover -s scripts -p 'test_daily_fulltext.py'
          python3 -m unittest discover -s scripts -p 'test_ci_daily.py'
          python3 -m unittest discover -s scripts -p 'test_workflow.py'
          python3 -m unittest discover -s scripts -p 'test_public_build.py'
          python3 -m unittest discover -s scripts -p 'test_release_build.py'
          python3 -m unittest discover -s scripts -p 'test_package_release.py'
      - name: Verify public source access without model calls
        continue-on-error: true
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import datetime
          import json
          import daily_fulltext as d
          papers, errors = d.discover(datetime.datetime.now(d.SHANGHAI).date())
          print(json.dumps({'eligible_public_articles':len(papers),'sourceErrors':errors}))
          assert papers, 'No accessible public full-text candidates'
          checked = 0
          for paper in papers[:8]:
              try:
                  paras, sha = d.parse_fulltext(d.fetch_bytes('https://www.ebi.ac.uk/europepmc/webservices/rest/'+paper['pmcid']+'/fullTextXML'),paper)
                  checked += 1
                  print(json.dumps({'pmcid':paper['pmcid'],'paragraphs':len(paras),'fullTextHash':sha}))
              except d.ReadingError as error:
                  print(json.dumps({'pmcid':paper['pmcid'],'reason':error.code}))
              if checked >= 3:
                  break
          assert checked >= 3, 'Fewer than three complete identity-matched full texts'
          PY
      - name: Revalidate stored source-bound drafts without model calls
        env:
          # Same state location as daily.yml (a separate private repository when configured).
          STATE_URL: https://x-access-token:${{ secrets.XINZHI_STATE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ vars.XINZHI_STATE_REPO || github.repository }}.git
        run: |
          git -c 'http.https://github.com/.extraheader=' fetch -q --depth=1 "$STATE_URL" state
          if git cat-file -e 'FETCH_HEAD:data/deep-readings.json' 2>/dev/null; then
            git archive FETCH_HEAD data/deep-readings.json data/deep-reading-ledger.json | tar -x -C .
            PYTHONPATH=scripts python3 - <<'PY'
          import json
          import daily_fulltext as d
          data=d.read(d.ROOT/d.DATA_PATH,d.empty_data())
          ledger=d.read(d.ROOT/d.LEDGER_PATH,d.empty_ledger())
          d.check_store(data,ledger)
          recovered=d.recover_drafts(data,ledger,d.now(),lambda *_:None)
          public=d.public_readings(data)
          assert 'drafts' not in public
          assert all('sourceParagraphs' not in item for item in public['items'])
          print(json.dumps({'recoveredWithoutModel':recovered,'validatedReadings':len(public['items']),'remainingDrafts':len(data.get('drafts',{}))}))
          PY
          fi

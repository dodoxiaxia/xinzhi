name: fulltext-queue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fulltext.yml'
      - 'scripts/fulltext_queue_runner.cjs'

concurrency:
  group: xinzhi-fulltext-queue
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  download:
    if: github.ref == 'refs/heads/main' && vars.FULLTEXT_ASYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 领取全文任务并回写网站（不读取模型或 PDF 凭据）
        run: node scripts/fulltext_queue_runner.cjs

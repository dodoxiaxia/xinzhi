name: preview-functions-metadata-read
on:
  push:
    branches: [codex/preview-functions-metadata-read-20261008]
permissions:
  contents: read
jobs:
  read-existing-functions-metadata:
    if: github.ref == 'refs/heads/codex/preview-functions-metadata-read-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read exact preview/production Functions and safe configuration metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/read_preview_functions_metadata.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-functions-metadata-${{ github.run_id }}
          path: .local/preview-functions-metadata/report.json
          if-no-files-found: error

name: muse-integration-checks
on:
  pull_request:
    paths:
      - 'edge/**'
      - 'app.js'
      - 'scripts/test_doi_library_ui.cjs'
      - 'scripts/*fulltext*'
      - 'scripts/*muse*'
      - 'scripts/github_oidc_keys.py'
      - 'scripts/test_github_oidc_keys.py'
      - 'scripts/test_worker_fetch_compat.cjs'
      - 'scripts/release_integrity.py'
      - 'editorial/fulltext-imports.json'
      - '.github/workflows/*muse*'
      - '.github/workflows/fulltext-import.yml'
      - '.github/workflows/drive-archive.yml'
      - 'scripts/*drive*'
permissions:
  contents: read
jobs:
  verify-muse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'pypdf==6.10.0' 'PyMuPDF==1.26.6'
      - name: Offline authentication, original integrity, ownership and PDF checks
        run: |
          node scripts/test_fulltext_import.cjs
          node scripts/test_muse_fulltext.cjs
          node scripts/test_muse_status_pages.cjs
          node scripts/test_muse_reader_upload.cjs
          node scripts/test_drive_archive.cjs
          node scripts/test_doi_manual_needed.cjs
          node scripts/test_doi_library_ui.cjs --helpers-only
          node scripts/test_fulltext_jobs.cjs
          node scripts/test_grok_fulltext.cjs
          node scripts/test_doi_library_worker.cjs
          node scripts/test_github_lfs_reuse.cjs
          npm exec --yes --package=workerd@1.20261009.1 -- node scripts/test_worker_fetch_compat.cjs
          python3 -m unittest discover -s scripts -p 'test_muse*.py'
          python3 -m unittest discover -s scripts -p 'test_github_oidc_keys.py'
          python3 -m unittest discover -s scripts -p 'test_release_decoupling.py'
      - name: Verify task progress in an offline browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")" node scripts/test_doi_library_ui.cjs

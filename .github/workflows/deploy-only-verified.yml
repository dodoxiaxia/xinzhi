name: deploy-only-verified

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: '发布用途（open / close；两者部署同一已核验原包）'
        required: true
        type: choice
        options:
          - open
          - close
      confirm:
        description: '必须输入固定确认字面量: publish-verified-d646340-c6eb758'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    concurrency:
      group: daily-refresh-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 校验所有发布闸门并从钉死 state 提交提取 19 文件原包
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          XINZHI_STATE_REPOSITORY: ${{ vars.XINZHI_STATE_REPO || 'dodoxiaxia/xinzhi-state' }}
          XINZHI_STATE_TOKEN: ${{ secrets.XINZHI_STATE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PURPOSE: ${{ inputs.purpose }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          python3 scripts/deploy_only_verified.py \
            --purpose "$INPUT_PURPOSE" \
            --confirm "$INPUT_CONFIRM" \
            --output-dir "${{ runner.temp }}/verified-public"

      - uses: actions/setup-node@v4
        if: steps.gate.outcome == 'success' && steps.gate.outputs.verified == 'true'
        with:
          node-version: '20'

      # Official repo is public, so fetch origin/main works without checkout credentials.
      # Do not persist checkout credentials. Recheck only needs the Cloudflare reads.
      - name: 临发布重新核生产代码SHA与远端main
        id: recheck
        if: steps.gate.outcome == 'success' && steps.gate.outputs.verified == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/deploy_only_verified.py --recheck-before-deploy

      - name: 发布已核验原包到 Cloudflare Pages
        if: steps.gate.outcome == 'success' && steps.gate.outputs.verified == 'true' && steps.recheck.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
        run: >-
          npx --yes wrangler@3 pages deploy "${{ runner.temp }}/verified-public"
          --project-name dryz-xinzhi
          --branch main
          --commit-dirty=true
          --commit-hash d646340107ca82ceb902ded4f64c403556ad7345

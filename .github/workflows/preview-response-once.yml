name: preview-response-once
on:
  push:
    branches: [codex/preview-response-once-20261008]
permissions:
  contents: read
concurrency:
  group: preview-response-once-20261008
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/codex/preview-response-once-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One ordinary read of the original public preview endpoint
        run: python3 scripts/read_preview_response_once.py
      - uses: actions/upload-artifact@v4
        with:
          name: preview-response-once-${{ github.run_id }}
          path: .local/preview-response-once/report.json
          if-no-files-found: error

